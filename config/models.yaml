# Model ids are configuration, not code (SPEC §8.1).
# Ids and prices from Anthropic's published model table (as of 2026-10-06). Not yet verified
# against the live API: no key in the build environment.
# Sonnet 5.5 and Haiku 5.5 reject non-default temperature (HTTP 400), so it is left unset, and
# both run adaptive thinking by default: thinking tokens count against max_tokens, hence the
# headroom over a 250-word brief. The gateway fails loudly if a model id is rejected.
gateway: litellm
tasks:
  brief_writer:   {model: "anthropic/claude-sonnet-5-5", max_tokens: 4000}
  fact_extractor: {model: "anthropic/claude-haiku-5-5",  max_tokens: 2000}
alternatives:     # compared in 7.6 when keys are available
  - "mistral/mistral-large-latest"
# USD per million tokens, used for the cost estimate in traces (provider list prices, 2026-10).
prices_per_mtok:
  "anthropic/claude-sonnet-5-5": {input: 2.00, output: 10.00}
  "anthropic/claude-haiku-5-5":  {input: 0.10, output: 0.50}
embeddings:
  default: "intfloat/multilingual-e5-small"   # replaced by the 7.5 winner
  candidates:
    - "intfloat/multilingual-e5-small"
    - "intfloat/multilingual-e5-base"
    - "BAAI/bge-m3"
  prefixes:   # query/passage prefixes required by each model family
    "intfloat/multilingual-e5-small": {query: "query: ", passage: "passage: "}
    "intfloat/multilingual-e5-base":  {query: "query: ", passage: "passage: "}
    "BAAI/bge-m3":                    {query: "", passage: ""}
  batch_size: 64
reranker: "BAAI/bge-reranker-v2-m3"
llm_extraction_enabled: true   # disabled by config if eForms coverage makes it useless (SPEC §6.4)
