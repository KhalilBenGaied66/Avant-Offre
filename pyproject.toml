[project]
name = "avant-offre"
version = "0.1.0"
description = "Go/no-go copilot for a corporate bid office answering French public tenders."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.10",
    "pyarrow>=17",
    "httpx>=0.27",
    "tenacity>=9",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "rapidfuzz>=3.9",
    "bm25s>=0.2.6",
    "lancedb>=0.13",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.12",
]

[project.optional-dependencies]
# Model runtime (embeddings, reranker). Heavy: kept out of the default install so
# lint/test/CI and the deterministic paths run on a small VM. See docs/DECISIONS.md.
semantic = [
    "sentence-transformers>=3.0",
    "torch>=2.3",
]
# LLM gateway. Without it (or without an API key) briefs use the deterministic template.
llm = [
    "litellm>=1.50",
]

[project.scripts]
avant-offre = "avant_offre.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avant_offre"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PTH", "PL"]
ignore = [
    "PLR0913",  # many-argument functions are fine for explicit pure functions
    "PLR0917",  # idem for positional arguments
    "PLR2004",  # magic values in comparisons: thresholds live in config, literals here are formats
    "S101",     # assert is used in tests
    "RUF001", "RUF002", "RUF003",  # French text legitimately contains ambiguous unicode (’, «, »)
    "S311",     # seeded `random` is used for reproducible sampling, never for security
]

[tool.ruff.lint.pylint]
max-branches = 15

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802"]
"scripts/**" = ["T201"]
# Batch data code composes SQL from config values, file paths and internal table names, never
# from request input. Request-facing modules (api/, agent/, search/, intel/) keep S608 active
# and bind every user value as a parameter.
"src/avant_offre/{ingest,transform,eval}/**" = ["S608"]
"src/avant_offre/quality.py" = ["S608"]
# Templates are French prose / HTML: their lines are content, not code.
"src/avant_offre/brief/template.py" = ["E501"]
"src/avant_offre/digest/digest.py" = ["E501"]
# Adaptive Card property names are fixed by the Microsoft schema (camelCase).
"src/avant_offre/digest/adaptive_card.py" = ["N815"]
# CLI commands import their module lazily to keep `avant-offre --help` fast.
"src/avant_offre/cli.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["bm25s.*", "lancedb.*", "sentence_transformers.*", "litellm.*", "yaml.*", "scipy.*", "pyarrow.*", "matplotlib.*", "rapidfuzz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: needs outbound access to the open-data sources",
    "semantic: needs the optional model runtime (sentence-transformers, torch)",
]
